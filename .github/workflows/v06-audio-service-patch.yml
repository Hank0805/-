name: Integrate v0.6 Audio Service

on:
  push:
    branches:
      - v0.6-studio-actual
    paths:
      - '.github/v06-audio-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply audio service patch
        run: python3 .github/scripts/v06_audio_service_patch.py
      - name: Commit audio service integration
        run: |
          git config user.name "Hank0805"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/jp/minobs/app/ScreenStreamService.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate independent audio mixer and thermal protection"
          git push
