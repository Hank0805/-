name: Integrate v0.6 Studio UI

on:
  push:
    branches:
      - v0.6-studio-actual
    paths:
      - '.github/v06-ui-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply UI patch
        run: python3 .github/scripts/v06_ui_patch.py
      - name: Commit UI integration
        run: |
          git config user.name "Hank0805"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/jp/minobs/app/ObsStudioActivity.kt app/src/main/java/jp/minobs/app/StudioUiEnhancer.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate v0.6 responsive OBS controls"
          git push
