name: Integrate v0.6 final recording and transitions

on:
  push:
    branches: [ v0.6-studio-actual ]
    paths:
      - .github/v06-finalize-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final v0.6 patch
        run: python3 .github/scripts/v06_finalize_patch.py
      - name: Commit integration
        run: |
          git config user.name "Hank0805"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/jp/minobs/app/ScreenStreamService.kt app/src/main/java/jp/minobs/app/ObsStudioActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate real multitrack recording and encoded transitions"
          git push
