name: Patch separate stream URL and key

on:
  push:
    branches: [ v0.5-obs-studio ]
    paths:
      - BUILD_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch output settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/jp/minobs/app/ObsStudioActivity.kt')
          s = p.read_text()
          old = '''  private fun showEndpointDialog() {
    dialogs.text("RTMP URL（複数は | で区切る）", getEndpoints().joinToString("|")) {
      saveEndpoints(it.split('|'))
    }
  }
'''
          new = '''  private fun showEndpointDialog() {
    StreamEndpointSettings.show(this) {
      toast("配信先設定を保存しました")
    }
  }
'''
          if old not in s:
              raise SystemExit('showEndpointDialog block not found')
          s = s.replace(old, new)

          old2 = '''  private fun getEndpoints(): List<String> =
    getSharedPreferences("studio_output", MODE_PRIVATE)
      .getString("rtmp", "")
      .orEmpty()
      .lines()
      .map { it.trim() }
      .filter { it.startsWith("rtmp://") || it.startsWith("rtmps://") }
      .take(4)

  private fun saveEndpoints(values: List<String>) {
    getSharedPreferences("studio_output", MODE_PRIVATE)
      .edit()
      .putString("rtmp", values.joinToString("\\n"))
      .apply()
  }
'''
          new2 = '''  private fun getEndpoints(): List<String> = StreamEndpointSettings.endpoints(this)
'''
          if old2 not in s:
              raise SystemExit('endpoint storage block not found')
          s = s.replace(old2, new2)
          s = s.replace('toast("出力設定でRTMP URLを設定してください")', 'toast("出力設定で配信サーバーURLとストリームキーを設定してください")')
          p.write_text(s)

          g = Path('app/build.gradle.kts')
          t = g.read_text()
          t = t.replace('versionCode = 8', 'versionCode = 9')
          t = t.replace('versionName = "0.5.2"', 'versionName = "0.5.3"')
          g.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name "Hank0805"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/jp/minobs/app/ObsStudioActivity.kt app/build.gradle.kts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate stream server URL and stream key"
          git push
